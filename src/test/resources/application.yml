server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    dynamic: false
    listener:
      simple:
        auto-startup: false
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session

    cookie:
      secure: false
      http-only: true
      path: /

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ticketing;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ticketing.domain
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.project.ticketing: DEBUG

queue:
  enter-batch-size: 50
  estimated-throughput: 50
  max-active-member: 1000
  active-time-ms: 300000
  safety-ttl-days: 3

scheduler:
  fixed-delay: 1000
  lock-at-least-for: PT1S
  lock-at-most-for: PT10S

ticketing:
  lock:
    strategy: PESSIMISTIC
  payment:
    expiration:
      scan-delay-ms: 60000
      batch-size: 100
    rabbitmq:
      exchange: ticketing.payment
      queue: ticketing.payment.requested
      routing-key: payment.requested
      listener-auto-startup: false
