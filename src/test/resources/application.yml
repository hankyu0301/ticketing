server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: false
        http-only: true
        path: /
        same-site: lax

spring:
  profiles:
    default: standalone
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    dynamic: false
    listener:
      simple:
        auto-startup: false
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session

  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.11.16:///ticketing
    username: test
    password: test

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ticketing.domain
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

logging:
  level:
    root: INFO
    com.project.ticketing: DEBUG

queue:
  enter-batch-size: 50
  estimated-throughput: 50
  max-active-member: 1000
  active-time-ms: 300000
  safety-ttl-days: 3

scheduler:
  fixed-delay: 1000
  lock-at-least-for: PT1S
  lock-at-most-for: PT10S

ticketing:
  scheduler:
    enabled: false
  lock:
    strategy: REDISSON
    wait-time-ms: 200
  reservation:
    hold-duration: PT30M
    expiration:
      scan-delay-ms: 60000
      process-limit: 300
      lock-at-least-for: PT1S
      lock-at-most-for: PT2M
  payment:
    rabbitmq:
      exchange: ticketing.payment
      queue: ticketing.payment.requested
      routing-key: payment.requested
      listener-auto-startup: false
