server:
  port: 8080

spring:
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/ticketing?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true
    username: root
    password: root

    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ticketing.domain
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.project.ticketing: DEBUG