server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session

    cookie:
      secure: false
      http-only: true
      path: /

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ticketing.domain
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.project.ticketing: DEBUG

queue:
  enter-batch-size: 50
  estimated-throughput: 50
  max-active-member: 1000
  active-time-ms: 300000
  safety-ttl-days: 3

scheduler:
  fixed-delay: 1000
  lock-at-least-for: PT1S
  lock-at-most-for: PT10S

ticketing:
  lock:
    strategy: REDISSON
    wait-time-ms: 200
    retry-interval-ms: 100
    lease-time-ms: 3000
  reservation:
    hold-duration: PT30M
    unavailable-cache:
      enabled: true
      temporary-ttl-buffer: PT1M
    expiration:
      scan-delay-ms: 60000
      process-limit: 300
      lock-at-least-for: PT1S
      lock-at-most-for: PT2M
  payment:
    rabbitmq:
      exchange: ticketing.payment
      queue: ticketing.payment.requested
      routing-key: payment.requested
      listener-auto-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
