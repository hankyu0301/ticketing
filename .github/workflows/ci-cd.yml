name: CI/CD

# 실행 조건
# PR에서는 test Job만 실행
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# 로컬 배포 설정
env:
  # EC2용 변수와 구분한다. 비워 두면 runner 사용자의 홈 아래에 배포한다.
  LOCAL_DEPLOY_DIR: ${{ vars.LOCAL_DEPLOY_DIR }}
  COMPOSE_PROJECT_NAME: ticketing-local
  APP_HEALTH_PATH: ${{ vars.APP_HEALTH_PATH || '/actuator/health' }}
  PUBLIC_PORT: ${{ vars.LOCAL_DEPLOY_PORT || '18000' }}
  BLUE_PORT: ${{ vars.BLUE_PORT || '18080' }}
  GREEN_PORT: ${{ vars.GREEN_PORT || '18081' }}
  DRAIN_SECONDS: ${{ vars.ACTIVE_APP_DRAIN_SECONDS || '10' }}

jobs:
  # test: 코드와 배포 스크립트가 유효한지 검사
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: test-${{ github.ref }}
      # 같은 PR이나 브랜치에 새 커밋이 push되면 이전 테스트 취소
      cancel-in-progress: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # Gradle 의존성 캐시 (springboot, junit 등 캐싱)
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      # 배포 스크립트 문법 오류 검사 / ShellCheck
      # Github runner에 ShellCheck 없으면
      # sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate deploy script
        run: |
          set -euo pipefail

          bash -n infra/deploy/blue-green-deploy.sh

          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

          shellcheck infra/deploy/blue-green-deploy.sh

      # 모든 테스트 수행
      - name: Run tests
        run: ./gradlew test

  # PR에서는 실행 X, test가 성공해야 실행
  build-push:
    if: github.event_name == 'push' && vars.ENABLE_CD == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Resolve image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          image_name="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_ref="$image_name:$COMMIT_SHA"

          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 하나의 이미지에 두 태그를 붙임.
          # 1. main <- 항상 가장 최근 이미지
          # 2. SHA <- 정확한 커밋 이미지
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 이전 docker 빌드 레이어를 github actions cache에 저장하고 재사용
          # 변경되지 않은 gradle 의존성 레이어, 변경되지 않은 OS 패키지 레이어, 멀티 스테이지 중간 레이어
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main 배포만 로컬 runner에서 실행한다. PR 테스트는 GitHub runner를 사용한다.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CD == 'true'
    needs: build-push
    runs-on: [self-hosted, linux, x64, ticketing-deploy]
    timeout-minutes: 20

    concurrency:
      group: cd-local
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy on local runner
        env:
          IMAGE_REF: ${{ needs.build-push.outputs.image_ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          # 로그인 정보는 이번 실행의 임시 폴더에만 저장한다.
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/ticketing-docker.XXXXXX")"
          export DOCKER_CONFIG
          trap 'rm -f -- "$DOCKER_CONFIG/config.json"; rmdir -- "$DOCKER_CONFIG" || true' EXIT
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GHCR_USER" --password-stdin

          bash infra/deploy/blue-green-deploy.sh \
            "${LOCAL_DEPLOY_DIR:-$HOME/ticketing-deploy}" \
            "$COMPOSE_PROJECT_NAME" "$IMAGE_REF" \
            "$APP_HEALTH_PATH" "$BLUE_PORT" "$GREEN_PORT" \
            "http://127.0.0.1:$PUBLIC_PORT$APP_HEALTH_PATH" "$DRAIN_SECONDS"
