name: CI/CD

# 실행 조건
# PR에서는 test Job만 실행
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# 공통 환경 변수
env:
  EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
  APP_DIR: ${{ vars.APP_DIR || '/home/ec2-user/ticketing' }}
  COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'ticketing' }}
  APP_HEALTH_PATH: ${{ vars.APP_HEALTH_PATH || '/actuator/health' }}
  BLUE_PORT: ${{ vars.BLUE_PORT || '18080' }}
  GREEN_PORT: ${{ vars.GREEN_PORT || '18081' }}
  PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'http://localhost/actuator/health' }}
  DRAIN_SECONDS: ${{ vars.ACTIVE_APP_DRAIN_SECONDS || '10' }}

jobs:
  # test: 코드와 배포 스크립트가 유효한지 검사
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: test-${{ github.ref }}
      # 같은 PR이나 브랜치에 새 커밋이 push되면 이전 테스트 취소
      cancel-in-progress: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # Gradle 의존성 캐시 (springboot, junit 등 캐싱)
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      # 배포 스크립트 문법 오류 검사 / ShellCheck
      # Github runner에 ShellCheck 없으면
      # sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate deploy script
        run: |
          set -euo pipefail

          bash -n infra/deploy/blue-green-deploy.sh

          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

          shellcheck infra/deploy/blue-green-deploy.sh

      # 모든 테스트 수행
      - name: Run tests
        run: ./gradlew test

  # PR에서는 실행 X, test가 성공해야 실행
  build-push:
    if: github.event_name == 'push' && vars.ENABLE_CD == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Resolve image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          image_name="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_ref="$image_name:$COMMIT_SHA"

          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 하나의 이미지에 두 태그를 붙임.
          # 1. main <- 항상 가장 최근 이미지
          # 2. SHA <- 정확한 커밋 이미지
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 이전 docker 빌드 레이어를 github actions cache에 저장하고 재사용
          # 변경되지 않은 gradle 의존성 레이어, 변경되지 않은 OS 패키지 레이어, 멀티 스테이지 중간 레이어
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 이미지 빌드와 GHCR push 성공하면 실행
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: cd-main
      # 배포 도중 새로운 배포가 와도 기존 배포를 취소하지 않음.
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

        # secret에 저장한 서버 키와 실제 서버 키가 일치해야 접속 가능
        # 접속 도중 다른 서버로 위장된 경우 방어 (strictHostKeyChecking=yes)
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ec2_key
          chmod 644 ~/.ssh/known_hosts

          ssh-keygen -F "$EC2_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Upload deploy files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$APP_DIR/nginx' '$APP_DIR/src/main/resources'"

          scp -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            docker-compose.bluegreen.yml \
            "$EC2_USER@$EC2_HOST:$APP_DIR/docker-compose.bluegreen.yml"

          scp -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            infra/nginx/10-server.conf \
            "$EC2_USER@$EC2_HOST:$APP_DIR/nginx/10-server.conf.next"

          scp -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            src/main/resources/schema.sql \
            "$EC2_USER@$EC2_HOST:$APP_DIR/src/main/resources/schema.sql"

        # github runner -> ssh -> ec2에서 docker login -> ec2 docker가 ghcr에서 이미지 pull
      - name: Log in to GHCR on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
              "$EC2_USER@$EC2_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_REF: ${{ needs.build-push.outputs.image_ref }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- \
              '$APP_DIR' '$COMPOSE_PROJECT_NAME' '$IMAGE_REF' \
              '$APP_HEALTH_PATH' '$BLUE_PORT' '$GREEN_PORT' \
              '$PUBLIC_HEALTH_URL' '$DRAIN_SECONDS'" \
            < infra/deploy/blue-green-deploy.sh
