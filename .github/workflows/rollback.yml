name: Rollback

# github actions ui에서 배포할 과거 커밋 sha 입력
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-local
  cancel-in-progress: false

env:
  # EC2용 변수와 구분한다. 비워 두면 runner 사용자의 홈 아래에 배포한다.
  LOCAL_DEPLOY_DIR: ${{ vars.LOCAL_DEPLOY_DIR }}
  COMPOSE_PROJECT_NAME: ticketing-local
  APP_HEALTH_PATH: ${{ vars.APP_HEALTH_PATH || '/actuator/health' }}
  PUBLIC_PORT: ${{ vars.LOCAL_DEPLOY_PORT || '18000' }}
  BLUE_PORT: ${{ vars.BLUE_PORT || '18080' }}
  GREEN_PORT: ${{ vars.GREEN_PORT || '18081' }}
  DRAIN_SECONDS: ${{ vars.ACTIVE_APP_DRAIN_SECONDS || '10' }}

jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_CD == 'true'
    runs-on: [self-hosted, linux, x64, ticketing-deploy]
    timeout-minutes: 20

    # SHA 검증 ( 소문자 40자리 SHA )
    steps:
      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "commit_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
        # 인프라 파일은 항상 최신 안정 버전에서 가져옴
      - name: Checkout deploy tooling
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

        # 입력한 SHA로 이미지 주소
      - name: Resolve image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          image_name="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'ref=%s:%s\n' "$image_name" "$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate deploy script
        run: |
          set -euo pipefail
          bash -n infra/deploy/blue-green-deploy.sh

      - name: Deploy rollback image on local runner
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          # 로그인 정보는 이번 실행의 임시 폴더에만 저장한다.
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/ticketing-docker.XXXXXX")"
          export DOCKER_CONFIG
          trap 'rm -f -- "$DOCKER_CONFIG/config.json"; rmdir -- "$DOCKER_CONFIG" || true' EXIT
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GHCR_USER" --password-stdin

          bash infra/deploy/blue-green-deploy.sh \
            "${LOCAL_DEPLOY_DIR:-$HOME/ticketing-deploy}" \
            "$COMPOSE_PROJECT_NAME" "$IMAGE_REF" \
            "$APP_HEALTH_PATH" "$BLUE_PORT" "$GREEN_PORT" \
            "http://127.0.0.1:$PUBLIC_PORT$APP_HEALTH_PATH" "$DRAIN_SECONDS"
