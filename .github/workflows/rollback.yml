name: Rollback

# github actions ui에서 배포할 과거 커밋 sha 입력
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-develop
  cancel-in-progress: false

env:
  EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
  APP_DIR: ${{ vars.APP_DIR || '/home/ec2-user/ticketing' }}
  COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'ticketing' }}
  APP_HEALTH_PATH: ${{ vars.APP_HEALTH_PATH || '/' }}
  BLUE_PORT: ${{ vars.BLUE_PORT || '18080' }}
  GREEN_PORT: ${{ vars.GREEN_PORT || '18081' }}
  PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'http://localhost/' }}
  DRAIN_SECONDS: ${{ vars.ACTIVE_APP_DRAIN_SECONDS || '10' }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # SHA 검증 ( 소문자 40자리 SHA )
    steps:
      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "commit_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
        # 인프라 파일은 항상 최신 안정 버전에서 가져옴
      - name: Checkout deploy tooling
        uses: actions/checkout@v6
        with:
          ref: develop

        # 입력한 SHA로 이미지 주소
      - name: Resolve image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          image_name="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'ref=%s:%s\n' "$image_name" "$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate deploy script
        run: |
          set -euo pipefail
          bash -n infra/deploy/blue-green-deploy.sh

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ec2_key
          chmod 644 ~/.ssh/known_hosts

          ssh-keygen -F "$EC2_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Upload target deploy files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$APP_DIR/nginx' '$APP_DIR/src/main/resources'"

          scp -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            docker-compose.bluegreen.yml \
            "$EC2_USER@$EC2_HOST:$APP_DIR/docker-compose.bluegreen.yml"

          scp -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            infra/nginx/10-server.conf \
            "$EC2_USER@$EC2_HOST:$APP_DIR/nginx/10-server.conf.next"

          scp -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            src/main/resources/schema.sql \
            "$EC2_USER@$EC2_HOST:$APP_DIR/src/main/resources/schema.sql"

      - name: Log in to GHCR on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
              "$EC2_USER@$EC2_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy rollback image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- \
              '$APP_DIR' '$COMPOSE_PROJECT_NAME' '$IMAGE_REF' \
              '$APP_HEALTH_PATH' '$BLUE_PORT' '$GREEN_PORT' \
              '$PUBLIC_HEALTH_URL' '$DRAIN_SECONDS'" \
            < infra/deploy/blue-green-deploy.sh